<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
    }

    .grid {
        width: 100%;
        max-width: 520px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
    }

    .tile {
        min-width: 0;
        text-decoration: none;
        color: white;
        background: #1f2937;
        border-radius: 13px;
        padding: 7px 3px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1;
        transition: transform 0.12s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .tile:active { transform: scale(0.96); }

    .icon {
        width: clamp(27px, 8vw, 40px);
        height: clamp(27px, 8vw, 40px);
        border-radius: 10px;
        margin-bottom: 5px;
        object-fit: cover;
        background: #374151;
        flex: 0 0 auto;
    }

    .label {
        width: 100%;
        padding: 0 1px;
        font-size: clamp(9px, 2.45vw, 12px);
        text-align: center;
        line-height: 1.1;
        overflow-wrap: anywhere;
        font-weight: 600;
    }

    @media (max-width: 360px) {
        body { padding: 5px; }
        .grid { gap: 5px; }
        .tile {
            border-radius: 11px;
            padding: 5px 2px;
        }
        .icon {
            width: clamp(24px, 7.4vw, 34px);
            height: clamp(24px, 7.4vw, 34px);
            margin-bottom: 4px;
        }
        .label { font-size: clamp(8px, 2.35vw, 10px); }
    }
</style>
