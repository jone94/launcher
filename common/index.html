<!DOCTYPE html>

<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">

<title>Rozcestnik</title>

<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
    }

    .grid {
        width: 100%;
        max-width: 520px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
    }

    .tile {
        min-width: 0;
        text-decoration: none;
        color: white;
        background: #1f2937;
        border-radius: 13px;
        padding: 4px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1;
        transition: transform 0.12s ease;
        -webkit-tap-highlight-color: transparent;

        position: relative;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    .tile:active { transform: scale(0.96); }

    .icon {
        width: 54px;
        height: 54px;
        border-radius: 11px;
        margin-bottom: 5px;
        object-fit: contain;
        background: #374151;
        flex: 0 0 auto;
        padding: 3px;
    }

    .submenu-grid .icon {
        width: 70px;
        height: 70px;
        border-radius: 13px;
        object-fit: contain;
        padding: 3px;
        margin-bottom: 6px;
    }
    
    .label {
        width: 100%;
        padding: 0 1px;
        font-size: 12px;
        text-align: center;
        line-height: 1.1;
        overflow-wrap: anywhere;
        font-weight: 600;
    }

    .tile.has-children::after {
        content: "⋯";
        position: absolute;
        top: 4px;
        right: 7px;
        font-size: 16px;
        color: #9ca3af;
        line-height: 1;
    }

    .submenu-overlay {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.58);
    }

    .submenu-overlay.open {
        display: flex;
    }

    .submenu-panel {
        width: min(340px, 92vw);
        max-height: 82vh;
        overflow: auto;
        background: #111827;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
    }

    .submenu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
    }

    .submenu-title {
        margin: 0;
        font-size: 18px;
        user-select: none;
        -webkit-user-select: none;
    }

    .submenu-close {
        border: 0;
        border-radius: 8px;
        padding: 7px 10px;
        background: #374151;
        color: white;
        cursor: pointer;

        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
    }

    .submenu-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
    }
    
    #submenuGrid.touch-locked {
      pointer-events: none;
    }

    .submenu-grid .tile {
        width: 100%;
    }

    @media (max-width: 360px) {
        body { padding: 5px; }
        .grid { gap: 5px; }
        .tile {
            border-radius: 11px;
            padding: 5px 2px;
        }
        .icon {
            width: 42px;
            height: 42px;
            margin-bottom: 4px;
        }
        .label {
            font-size: 11px;
        }
    }
</style>

<body>
<div class="grid" id="launcher-grid"></div>

<div id="submenu-overlay" class="submenu-overlay" aria-hidden="true">
  <div class="submenu-panel" role="dialog" aria-modal="true" aria-labelledby="submenu-title">
    <div class="submenu-header">
      <h2 id="submenu-title" class="submenu-title">Další odkazy</h2>
      <button id="submenu-close" class="submenu-close" type="button">✕ Zavřít</button>
    </div>
    <div id="submenu-grid" class="submenu-grid"></div>
  </div>
</div>

<script>
(function () {
    const dataEl = document.getElementById("launcher-data");
    const grid = document.getElementById("launcher-grid");
    const submenuOverlay = document.getElementById("submenu-overlay");
    const submenuGrid = document.getElementById("submenu-grid");
    const submenuTitle = document.getElementById("submenu-title");
    const submenuClose = document.getElementById("submenu-close");

    const LONG_PRESS_MS = 550;
    let longPressTimer = null;
    let longPressTriggered = false;
    let submenuTouchLocked = false;

    function createTile(tile) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = tile.url || "#";
        a.rel = "noreferrer noopener";
        a.referrerPolicy = "no-referrer";

        const hasChildren = Array.isArray(tile.children) && tile.children.length > 0;
        if (hasChildren) {
            a.classList.add("has-children");
        }

        const img = document.createElement("img");
        img.className = "icon";
        img.src = tile.iconUrl || "";
        img.alt = "";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = tile.name || "LINK";

        a.appendChild(img);
        a.appendChild(label);

        if (hasChildren) {
            a.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                openSubmenu(tile);
            });

           a.addEventListener("pointerdown", (event) => {
                if (event.pointerType === "mouse" && event.button !== 0) {
                    return;
                }
            
                longPressTriggered = false;
                clearTimeout(longPressTimer);
            
                /*
                 * Původní dotyk zůstane přiřazen původní dlaždici,
                 * i když se mezitím otevře submenu pod prstem.
                 */
                if (a.setPointerCapture) {
                    try {
                        a.setPointerCapture(event.pointerId);
                    } catch (_) {
                        // Některé prohlížeče pointer capture nepodporují.
                    }
                }
            
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    submenuTouchLocked = true;
            
                    submenuGrid.classList.add("touch-locked");
            
                    openSubmenu(tile);
                }, LONG_PRESS_MS);
            });

            ["pointerup", "pointercancel"].forEach(type => {
                a.addEventListener(type, () => {
                    clearTimeout(longPressTimer);
            
                    if (submenuTouchLocked) {
                        /*
                         * Krátké zpoždění potlačí i následné syntetické
                         * kliknutí, které může Android Chrome vytvořit.
                         */
                        setTimeout(() => {
                            submenuTouchLocked = false;
                            submenuGrid.classList.remove("touch-locked");
                        }, 150);
                    }
                });
            });
            
            a.addEventListener("pointerleave", () => {
                /*
                 * Pokud long press ještě nebyl aktivován,
                 * opuštění dlaždice časovač zruší.
                 */
                if (!longPressTriggered) {
                    clearTimeout(longPressTimer);
                }
            });

            a.addEventListener("click", (event) => {
                if (longPressTriggered) {
                    event.preventDefault();
                    longPressTriggered = false;
                }
            });

            a.addEventListener("mouseenter", () => {
                if (window.matchMedia("(hover: hover)").matches) {
                    clearTimeout(longPressTimer);
                    longPressTimer = setTimeout(() => openSubmenu(tile), 700);
                }
            });

            a.addEventListener("mouseleave", () => {
                clearTimeout(longPressTimer);
            });
        }

        return a;
    }

   function openSubmenu(tile) {
        const children = Array.isArray(tile.children)
            ? tile.children
            : [];
    
        if (children.length === 0) {
            return;
        }
    
        submenuTitle.textContent = tile.name || "Další odkazy";
        submenuGrid.innerHTML = "";
    
        children.forEach(child => {
            submenuGrid.appendChild(createTile(child));
        });
    
        submenuOverlay.classList.add("open");
        submenuOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSubmenu() {
        submenuOverlay.classList.remove("open");
        submenuOverlay.setAttribute("aria-hidden", "true");
    
        clearTimeout(longPressTimer);
        submenuTouchLocked = false;
        submenuGrid.classList.remove("touch-locked");
    }

    submenuClose.addEventListener("click", closeSubmenu);

    submenuOverlay.addEventListener("click", (event) => {
        if (event.target === submenuOverlay) {
            closeSubmenu();
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            closeSubmenu();
        }
    });

    function render() {
        try {
            const data = JSON.parse(dataEl.textContent || "{\"tiles\":[]}");
            const tiles = Array.isArray(data.tiles) ? data.tiles : [];

            grid.innerHTML = "";

            tiles.forEach(tile => {
                grid.appendChild(createTile(tile));
            });
        } catch (error) {
            console.error("Chyba v launcher-data JSON:", error);
            grid.innerHTML = `
                <div style="grid-column:1/-1;padding:16px;background:#7f1d1d;border-radius:12px;">
                    Chyba v datech rozcestníku: ${error.message}
                </div>
            `;
        }
    }

    render();
})();
</script>
