<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
    }

    .grid {
        width: 100%;
        max-width: 520px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
    }

    .tile {
        min-width: 0;
        text-decoration: none;
        color: white;
        background: #1f2937;
        border-radius: 13px;
        padding: 4px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1;
        transition: transform 0.12s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .tile:active { transform: scale(0.96); }

    .icon {
        width: 46px;
        height: 46px;
        border-radius: 11px;
        margin-bottom: 5px;
        object-fit: cover;
        background: #374151;
        flex: 0 0 auto;
    }

    .label {
        width: 100%;
        padding: 0 1px;
        font-size: 12px;
        text-align: center;
        line-height: 1.1;
        overflow-wrap: anywhere;
        font-weight: 600;
    }

    @media (max-width: 360px) {
        body { padding: 5px; }
        .grid { gap: 5px; }
        .tile {
            border-radius: 11px;
            padding: 5px 2px;
        }
        .icon {
            width: 42px;
            height: 42px;
            margin-bottom: 4px;
        }
        .label {
            font-size: 11px;
        }
    }
</style>

<body>
<div class="grid" id="launcher-grid"></div>

<script>
(function () {
    const dataEl = document.getElementById("launcher-data");
    const grid = document.getElementById("launcher-grid");

    function render() {
        const data = JSON.parse(dataEl.textContent || "{\"tiles\":[]}");
        const tiles = Array.isArray(data.tiles) ? data.tiles : [];

        grid.innerHTML = "";

        tiles.forEach((tile) => {
            const a = document.createElement("a");
            a.className = "tile";
            a.href = tile.url;
            a.rel = "noreferrer noopener";
            a.referrerPolicy = "no-referrer";

            const img = document.createElement("img");
            img.className = "icon";
            img.src = tile.iconUrl || "";
            img.alt = "";

            const label = document.createElement("div");
            label.className = "label";
            label.textContent = tile.name || "LINK";

            a.appendChild(img);
            a.appendChild(label);
            grid.appendChild(a);
        });
    }

    render();
})();
</script>
